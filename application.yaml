apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fastapi-stage9
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Malavikatamilselvan/fastapi-gitops.git
    targetRevision: main
    path: helm/fastapi-chart
    helm:
      releaseName: fastapi-stage9

  destination:
    server: https://kubernetes.default.svc
    namespace: fastapi

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
